<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Circuit parts and their matrix rows" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><title>Circuit parts and their matrix rows</title><rect width="1000" height="500" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700">Circuit parts, and the matrix rows that make them</text><text x="30" y="62" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400">Weights are the wiring. Example rows show the form; counts are from the shipped weight file.</text><text x="30" y="92" font-size="13" fill="#5b6b7b" text-anchor="start" font-weight="700">Part</text><text x="210" y="92" font-size="13" fill="#5b6b7b" text-anchor="start" font-weight="700">Neuron</text><text x="500" y="92" font-size="13" fill="#5b6b7b" text-anchor="start" font-weight="700">Its row in the matrix</text><text x="770" y="92" font-size="13" fill="#5b6b7b" text-anchor="start" font-weight="700">Count</text><path d="M30 117h18M30 137h18M88 127h18" fill="none" stroke="#1c2733" stroke-width="2"/><path d="M48 108h20a20 19 0 0 1 0 38h-20z" fill="#e8f0fc" stroke="#2563c9" stroke-width="2"/><text x="118" y="132" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="600">AND</text><text x="210" y="132" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">step( a + b − 1 )</text><text x="500" y="132" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">F row: a=1, b=1   bias −1</text><text x="770" y="132" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400">13,512 in this exact form</text><path d="M30 162H970" stroke="#e6ebf0"/><path d="M30 181h22M30 201h22M90 191h16" fill="none" stroke="#1c2733" stroke-width="2"/><path d="M46 172q30 0 44 19q-14 19 -44 19q10 -19 0 -38z" fill="#e8f0fc" stroke="#2563c9" stroke-width="2"/><text x="118" y="196" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="600">OR</text><text x="210" y="196" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">step( a + b )</text><text x="500" y="196" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">F row: a=1, b=1   bias 0</text><text x="770" y="196" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400">460 in this exact form</text><path d="M30 226H970" stroke="#e6ebf0"/><path d="M30 245h18M30 265h18M86 255h20" fill="none" stroke="#1c2733" stroke-width="2"/><path d="M48 234v42l38 -21z" fill="#e8f0fc" stroke="#2563c9" stroke-width="2"/><text x="54" y="249" font-size="11" fill="#1c2733" text-anchor="start" font-weight="400">+</text><text x="54" y="269" font-size="11" fill="#1c2733" text-anchor="start" font-weight="400">−</text><text x="118" y="260" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="600">Comparator</text><text x="210" y="260" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">step( x − 214 )</text><text x="500" y="260" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">F row: x=1   bias −214</text><text x="770" y="260" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400">9,424, plus 91,104 with an enable</text><path d="M30 290H970" stroke="#e6ebf0"/><path d="M30 326h22M84 326h22M68 300v14" fill="none" stroke="#0f9d8a" stroke-width="2"/><circle cx="54" cy="326" r="3" fill="#0f9d8a"/><circle cx="82" cy="326" r="3" fill="#0f9d8a"/><path d="M54 326L80 315" stroke="#0f9d8a" stroke-width="2"/><text x="118" y="324" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="600">Switch</text><text x="210" y="324" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">relu( v + en·2^40 − 2^40 )</text><text x="500" y="324" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">F row: v=1, en=2^40   bias −2^40</text><text x="770" y="324" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400">85,027</text><path d="M30 354H970" stroke="#e6ebf0"/><path d="M30 373h22M30 393h22M86 383h20" fill="none" stroke="#0f9d8a" stroke-width="2"/><circle cx="68" cy="383" r="18" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="2"/><text x="68" y="389" font-size="17" fill="#1c2733" text-anchor="middle" font-weight="700">Σ</text><text x="118" y="388" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="600">Adder</text><text x="210" y="388" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">a + b</text><text x="500" y="388" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">F row: a=1, b=1   identity</text><text x="770" y="388" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400">21,831, with wires</text><path d="M30 418H970" stroke="#e6ebf0"/><path d="M30 447h18M88 447h18M96 447v28h-56v-28" fill="none" stroke="#d97706" stroke-width="2"/><rect x="48" y="428" width="40" height="38" rx="3" fill="#fdf1e0" stroke="#d97706" stroke-width="2"/><text x="68" y="452" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="700">D</text><text x="118" y="452" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="600">Register</text><text x="210" y="452" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">r(t) = r(t−1) + set − clear</text><text x="500" y="452" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">R row: r=1, then gated changes</text><text x="770" y="452" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400">state held over ticks</text></svg>