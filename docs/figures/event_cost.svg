<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Fraction of neurons firing per event" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Fraction of neurons firing per event</title><rect width="1000" height="372" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Almost all of the network is silent on any event</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Neurons that fired at least once, out of 235,022. Short document, measured on the real weights.</text><text x="30" y="102" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a letter</text><rect x="210" y="84" width="187.1" height="26" rx="4" fill="#2563c9"><title>1393 neurons, 65 ticks</title></rect><text x="405.0764462809917" y="102" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,393 = 0.59%, 65 ticks</text><text x="30" y="142" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a new letter</text><rect x="210" y="124" width="273.4" height="26" rx="4" fill="#2563c9"><title>2036 neurons, 148 ticks</title></rect><text x="491.4297520661157" y="142" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,036 = 0.87%, 148 ticks</text><text x="30" y="182" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Move the mouse</text><rect x="210" y="164" width="201.8" height="26" rx="4" fill="#2563c9"><title>1503 neurons, 10 ticks</title></rect><text x="419.84917355371897" y="182" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,503 = 0.64%, 10 ticks</text><text x="30" y="222" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Click in text</text><rect x="210" y="204" width="468.0" height="26" rx="4" fill="#2563c9"><title>3485 neurons, 369 ticks</title></rect><text x="686.0268595041323" y="222" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,485 = 1.48%, 369 ticks</text><text x="30" y="262" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Scroll one notch</text><rect x="210" y="244" width="434.9" height="26" rx="4" fill="#2563c9"><title>3238 neurons, 351 ticks</title></rect><text x="652.8553719008264" y="262" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,238 = 1.38%, 351 ticks</text><text x="30" y="302" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Press Ctrl+B</text><rect x="210" y="284" width="450.7" height="26" rx="4" fill="#2563c9"><title>3356 neurons, 356 ticks</title></rect><text x="668.702479338843" y="302" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,356 = 1.43%, 356 ticks</text><text x="30" y="342" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Paste two lines</text><rect x="210" y="324" width="520.0" height="26" rx="4" fill="#2563c9"><title>3872 neurons, 480 ticks</title></rect><text x="738.0" y="342" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,872 = 1.65%, 480 ticks</text></svg>