<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Fraction of neurons firing per event" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Fraction of neurons firing per event</title><rect width="1000" height="372" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Almost all of the network is silent on any event</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Neurons that fired at least once, out of 243,217. Short document, measured on the real weights.</text><text x="30" y="102" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a letter</text><rect x="210" y="84" width="188.9" height="26" rx="4" fill="#2563c9"><title>1396 neurons, 65 ticks</title></rect><text x="406.943258719417" y="102" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,396 = 0.57%, 65 ticks</text><text x="30" y="142" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a new letter</text><rect x="210" y="124" width="273.4" height="26" rx="4" fill="#2563c9"><title>2020 neurons, 148 ticks</title></rect><text x="491.3992712129099" y="142" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,020 = 0.83%, 148 ticks</text><text x="30" y="182" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Move the mouse</text><rect x="210" y="164" width="195.7" height="26" rx="4" fill="#2563c9"><title>1446 neurons, 10 ticks</title></rect><text x="413.71056741280586" y="182" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,446 = 0.59%, 10 ticks</text><text x="30" y="222" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Click in text</text><rect x="210" y="204" width="473.0" height="26" rx="4" fill="#2563c9"><title>3495 neurons, 369 ticks</title></rect><text x="691.0348776678813" y="222" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,495 = 1.44%, 369 ticks</text><text x="30" y="262" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Scroll one notch</text><rect x="210" y="244" width="439.5" height="26" rx="4" fill="#2563c9"><title>3247 neurons, 351 ticks</title></rect><text x="657.4690265486726" y="262" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,247 = 1.34%, 351 ticks</text><text x="30" y="302" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Press Ctrl+B</text><rect x="210" y="284" width="455.4" height="26" rx="4" fill="#2563c9"><title>3365 neurons, 356 ticks</title></rect><text x="673.4398750650703" y="302" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,365 = 1.38%, 356 ticks</text><text x="30" y="342" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Paste two lines</text><rect x="210" y="324" width="520.0" height="26" rx="4" fill="#2563c9"><title>3842 neurons, 481 ticks</title></rect><text x="738.0" y="342" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,842 = 1.58%, 481 ticks</text></svg>