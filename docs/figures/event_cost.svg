<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Fraction of neurons firing per event" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Fraction of neurons firing per event</title><rect width="1000" height="372" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Almost all of the network is silent on any event</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Neurons that fired at least once, out of 237,522. Short document, measured on the real weights.</text><text x="30" y="102" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a letter</text><rect x="210" y="84" width="188.8" height="26" rx="4" fill="#2563c9"><title>1391 neurons, 65 ticks</title></rect><text x="406.80709997389715" y="102" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,391 = 0.59%, 65 ticks</text><text x="30" y="142" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a new letter</text><rect x="210" y="124" width="273.5" height="26" rx="4" fill="#2563c9"><title>2015 neurons, 148 ticks</title></rect><text x="491.50561211172015" y="142" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,015 = 0.85%, 148 ticks</text><text x="30" y="182" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Move the mouse</text><rect x="210" y="164" width="196.3" height="26" rx="4" fill="#2563c9"><title>1446 neurons, 10 ticks</title></rect><text x="414.2725137039937" y="182" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,446 = 0.61%, 10 ticks</text><text x="30" y="222" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Click in text</text><rect x="210" y="204" width="473.0" height="26" rx="4" fill="#2563c9"><title>3485 neurons, 369 ticks</title></rect><text x="691.0357608979378" y="222" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,485 = 1.47%, 369 ticks</text><text x="30" y="262" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Scroll one notch</text><rect x="210" y="244" width="439.4" height="26" rx="4" fill="#2563c9"><title>3237 neurons, 351 ticks</title></rect><text x="657.3735317149569" y="262" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,237 = 1.36%, 351 ticks</text><text x="30" y="302" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Press Ctrl+B</text><rect x="210" y="284" width="455.3" height="26" rx="4" fill="#2563c9"><title>3354 neurons, 356 ticks</title></rect><text x="673.2545027407987" y="302" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,354 = 1.41%, 356 ticks</text><text x="30" y="342" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Paste two lines</text><rect x="210" y="324" width="520.0" height="26" rx="4" fill="#2563c9"><title>3831 neurons, 480 ticks</title></rect><text x="738.0" y="342" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,831 = 1.61%, 480 ticks</text></svg>