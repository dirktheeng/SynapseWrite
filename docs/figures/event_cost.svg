<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Fraction of neurons firing per event" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Fraction of neurons firing per event</title><rect width="1000" height="372" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Almost all of the network is silent on any event</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Neurons that fired at least once, out of 450,104. Short document, measured on the real weights.</text><text x="30" y="102" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a letter</text><rect x="210" y="84" width="165.5" height="26" rx="4" fill="#2563c9"><title>1371 neurons, 65 ticks</title></rect><text x="383.4874651810585" y="102" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,371 = 0.30%, 65 ticks</text><text x="30" y="142" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a new letter</text><rect x="210" y="124" width="258.1" height="26" rx="4" fill="#2563c9"><title>2138 neurons, 148 ticks</title></rect><text x="476.0687093779016" y="142" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,138 = 0.48%, 148 ticks</text><text x="30" y="182" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Move the mouse</text><rect x="210" y="164" width="192.9" height="26" rx="4" fill="#2563c9"><title>1598 neurons, 10 ticks</title></rect><text x="410.8876508820798" y="182" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,598 = 0.36%, 10 ticks</text><text x="30" y="222" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Click in text</text><rect x="210" y="204" width="399.5" height="26" rx="4" fill="#2563c9"><title>3310 neurons, 325 ticks</title></rect><text x="617.5357474466109" y="222" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,310 = 0.74%, 325 ticks</text><text x="30" y="262" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Scroll one notch</text><rect x="210" y="244" width="369.0" height="26" rx="4" fill="#2563c9"><title>3057 neurons, 307 ticks</title></rect><text x="586.9972144846797" y="262" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,057 = 0.68%, 307 ticks</text><text x="30" y="302" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Press Ctrl+B</text><rect x="210" y="284" width="382.2" height="26" rx="4" fill="#2563c9"><title>3166 neurons, 312 ticks</title></rect><text x="600.1541318477252" y="302" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,166 = 0.70%, 312 ticks</text><text x="30" y="342" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Paste two lines</text><rect x="210" y="324" width="520.0" height="26" rx="4" fill="#2563c9"><title>4308 neurons, 436 ticks</title></rect><text x="738.0" y="342" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >4,308 = 0.96%, 436 ticks</text></svg>