<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Fraction of neurons firing per event" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Fraction of neurons firing per event</title><rect width="1000" height="372" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Almost all of the network is silent on any event</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Neurons that fired at least once, out of 443,759. Short document, measured on the real weights.</text><text x="30" y="102" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a letter</text><rect x="210" y="84" width="241.9" height="26" rx="4" fill="#2563c9"><title>1729 neurons, 156 ticks</title></rect><text x="459.8832391713747" y="102" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,729 = 0.39%, 156 ticks</text><text x="30" y="142" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a new letter</text><rect x="210" y="124" width="296.3" height="26" rx="4" fill="#2563c9"><title>2118 neurons, 154 ticks</title></rect><text x="514.3034705407587" y="142" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,118 = 0.48%, 154 ticks</text><text x="30" y="182" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Move the mouse</text><rect x="210" y="164" width="179.3" height="26" rx="4" fill="#2563c9"><title>1282 neurons, 10 ticks</title></rect><text x="397.34893731503905" y="182" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,282 = 0.29%, 10 ticks</text><text x="30" y="222" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Click in text</text><rect x="210" y="204" width="366.5" height="26" rx="4" fill="#2563c9"><title>2620 neurons, 313 ticks</title></rect><text x="584.532149582997" y="222" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,620 = 0.59%, 313 ticks</text><text x="30" y="262" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Scroll one notch</text><rect x="210" y="244" width="330.7" height="26" rx="4" fill="#2563c9"><title>2364 neurons, 295 ticks</title></rect><text x="548.7183212267958" y="262" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,364 = 0.53%, 295 ticks</text><text x="30" y="302" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Press Ctrl+B</text><rect x="210" y="284" width="346.5" height="26" rx="4" fill="#2563c9"><title>2477 neurons, 300 ticks</title></rect><text x="564.5267688996503" y="302" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,477 = 0.56%, 300 ticks</text><text x="30" y="342" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Paste two lines</text><rect x="210" y="324" width="520.0" height="26" rx="4" fill="#2563c9"><title>3717 neurons, 423 ticks</title></rect><text x="738.0" y="342" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,717 = 0.84%, 423 ticks</text></svg>