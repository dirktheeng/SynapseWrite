<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Fraction of neurons firing per event" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Fraction of neurons firing per event</title><rect width="1000" height="372" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Almost all of the network is silent on any event</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Neurons that fired at least once, out of 444,066. Short document, measured on the real weights.</text><text x="30" y="102" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a letter</text><rect x="210" y="84" width="155.8" height="26" rx="4" fill="#2563c9"><title>1122 neurons, 65 ticks</title></rect><text x="373.79172229639516" y="102" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,122 = 0.25%, 65 ticks</text><text x="30" y="142" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a new letter</text><rect x="210" y="124" width="281.0" height="26" rx="4" fill="#2563c9"><title>2024 neurons, 136 ticks</title></rect><text x="499.03604806408543" y="142" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,024 = 0.46%, 136 ticks</text><text x="30" y="182" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Move the mouse</text><rect x="210" y="164" width="178.7" height="26" rx="4" fill="#2563c9"><title>1287 neurons, 10 ticks</title></rect><text x="396.7022696929239" y="182" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,287 = 0.29%, 10 ticks</text><text x="30" y="222" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Click in text</text><rect x="210" y="204" width="368.1" height="26" rx="4" fill="#2563c9"><title>2651 neurons, 313 ticks</title></rect><text x="586.0961281708945" y="222" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,651 = 0.60%, 313 ticks</text><text x="30" y="262" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Scroll one notch</text><rect x="210" y="244" width="333.1" height="26" rx="4" fill="#2563c9"><title>2399 neurons, 295 ticks</title></rect><text x="551.105473965287" y="262" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,399 = 0.54%, 295 ticks</text><text x="30" y="302" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Press Ctrl+B</text><rect x="210" y="284" width="348.1" height="26" rx="4" fill="#2563c9"><title>2507 neurons, 300 ticks</title></rect><text x="566.1014686248332" y="302" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,507 = 0.56%, 300 ticks</text><text x="30" y="342" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Paste two lines</text><rect x="210" y="324" width="520.0" height="26" rx="4" fill="#2563c9"><title>3745 neurons, 423 ticks</title></rect><text x="738.0" y="342" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,745 = 0.84%, 423 ticks</text></svg>