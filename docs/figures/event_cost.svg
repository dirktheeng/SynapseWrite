<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Fraction of neurons firing per event" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Fraction of neurons firing per event</title><rect width="1000" height="372" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Almost all of the network is silent on any event</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Neurons that fired at least once, out of 534,342. Short document, measured on the real weights.</text><text x="30" y="102" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a letter</text><rect x="210" y="84" width="158.0" height="26" rx="4" fill="#2563c9"><title>1390 neurons, 65 ticks</title></rect><text x="375.9545454545455" y="102" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,390 = 0.26%, 65 ticks</text><text x="30" y="142" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a new letter</text><rect x="210" y="124" width="247.3" height="26" rx="4" fill="#2563c9"><title>2176 neurons, 148 ticks</title></rect><text x="465.27272727272725" y="142" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,176 = 0.41%, 148 ticks</text><text x="30" y="182" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Move the mouse</text><rect x="210" y="164" width="169.5" height="26" rx="4" fill="#2563c9"><title>1492 neurons, 10 ticks</title></rect><text x="387.5454545454545" y="182" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,492 = 0.28%, 10 ticks</text><text x="30" y="222" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Click in text</text><rect x="210" y="204" width="394.9" height="26" rx="4" fill="#2563c9"><title>3475 neurons, 369 ticks</title></rect><text x="612.8863636363636" y="222" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,475 = 0.65%, 369 ticks</text><text x="30" y="262" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Scroll one notch</text><rect x="210" y="244" width="367.4" height="26" rx="4" fill="#2563c9"><title>3233 neurons, 351 ticks</title></rect><text x="585.3863636363636" y="262" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,233 = 0.61%, 351 ticks</text><text x="30" y="302" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Press Ctrl+B</text><rect x="210" y="284" width="380.8" height="26" rx="4" fill="#2563c9"><title>3351 neurons, 356 ticks</title></rect><text x="598.7954545454545" y="302" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,351 = 0.63%, 356 ticks</text><text x="30" y="342" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Paste two lines</text><rect x="210" y="324" width="520.0" height="26" rx="4" fill="#2563c9"><title>4576 neurons, 480 ticks</title></rect><text x="738.0" y="342" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >4,576 = 0.86%, 480 ticks</text></svg>