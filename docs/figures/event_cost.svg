<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Fraction of neurons firing per event" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Fraction of neurons firing per event</title><rect width="1000" height="372" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Almost all of the network is silent on any event</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Neurons that fired at least once, out of 532,657. Short document, measured on the real weights.</text><text x="30" y="102" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a letter</text><rect x="210" y="84" width="157.7" height="26" rx="4" fill="#2563c9"><title>1386 neurons, 65 ticks</title></rect><text x="375.6722817764165" y="102" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,386 = 0.26%, 65 ticks</text><text x="30" y="142" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Type a new letter</text><rect x="210" y="124" width="247.1" height="26" rx="4" fill="#2563c9"><title>2172 neurons, 148 ticks</title></rect><text x="465.08816451542333" y="142" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,172 = 0.41%, 148 ticks</text><text x="30" y="182" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Move the mouse</text><rect x="210" y="164" width="169.8" height="26" rx="4" fill="#2563c9"><title>1493 neurons, 10 ticks</title></rect><text x="387.8446729380879" y="182" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >1,493 = 0.28%, 10 ticks</text><text x="30" y="222" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Click in text</text><rect x="210" y="204" width="394.5" height="26" rx="4" fill="#2563c9"><title>3468 neurons, 369 ticks</title></rect><text x="612.5219864362284" y="222" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,468 = 0.65%, 369 ticks</text><text x="30" y="262" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Scroll one notch</text><rect x="210" y="244" width="367.2" height="26" rx="4" fill="#2563c9"><title>3228 neurons, 351 ticks</title></rect><text x="585.2194268212645" y="262" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,228 = 0.61%, 351 ticks</text><text x="30" y="302" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Press Ctrl+B</text><rect x="210" y="284" width="380.0" height="26" rx="4" fill="#2563c9"><title>3340 neurons, 356 ticks</title></rect><text x="597.9606213082477" y="302" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >3,340 = 0.63%, 356 ticks</text><text x="30" y="342" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Paste two lines</text><rect x="210" y="324" width="520.0" height="26" rx="4" fill="#2563c9"><title>4571 neurons, 480 ticks</title></rect><text x="738.0" y="342" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >4,571 = 0.86%, 480 ticks</text></svg>