<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 354" width="1000" height="354" role="img" aria-label="Neuron counts per family of sub-networks" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
