nd registers</text><rect x="290" y="260" width="47.4" height="28" rx="4" fill="#2563c9"><title>Compiled control and registers: 11,912</title></rect><text x="345.4298228150508" y="279" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >11,912 (4.9%)</text><text x="30" y="323" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Ribbon and chrome</text><rect x="290" y="304" width="10.0" height="28" rx="4" fill="#2563c9"><title>Ribbon and chrome: 2,504</title></rect><text x="307.9701373681067" y="323" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,504 (1.0%)</text></svg>