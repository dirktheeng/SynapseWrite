<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 354" width="1000" height="354" role="img" aria-label="Neuron counts per family of sub-networks" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Neuron counts per family of sub-networks</title><rect width="1000" height="354" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Where the neurons are</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >450,104 neurons in 73 named sub-networks. Most of the weight is the fonts.</text><text x="30" y="103" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Font outlines as neurons</text><rect x="290" y="84" width="520.0" height="28" rx="4" fill="#2563c9"><title>Font outlines as neurons: 360,490</title></rect><text x="818.0" y="103" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >360,490 (80.1%)</text><text x="30" y="147" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Glyph machinery and metrics</text><rect x="290" y="128" width="48.2" height="28" rx="4" fill="#2563c9"><title>Glyph machinery and metrics: 33,421</title></rect><text x="346.2091597547782" y="147" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >33,421 (7.4%)</text><text x="30" y="191" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Editing, layout and everything else</text><rect x="290" y="172" width="43.2" height="28" rx="4" fill="#2563c9"><title>Editing, layout and everything else: 29,922</title></rect><text x="341.1619184998197" y="191" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >29,922 (6.6%)</text><text x="30" y="235" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >File formats</text><rect x="290" y="216" width="17.9" height="28" rx="4" fill="#2563c9"><title>File formats: 12,392</title></rect><text x="315.8752253876668" y="235" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >12,392 (2.8%)</text><text x="30" y="279" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Compiled control and registers</text><rect x="290" y="260" width="16.1" height="28" rx="4" fill="#2563c9"><title>Compiled control and registers: 11,174</title></rect><text x="314.11828344752973" y="279" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >11,174 (2.5%)</text><text x="30" y="323" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Ribbon and chrome</text><rect x="290" y="304" width="4.0" height="28" rx="4" fill="#2563c9"><title>Ribbon and chrome: 2,705</title></rect><text x="302" y="323" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,705 (0.6%)</text></svg>