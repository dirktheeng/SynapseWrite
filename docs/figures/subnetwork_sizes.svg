d registers</text><rect x="290" y="260" width="52.3" height="28" rx="4" fill="#2563c9"><title>Compiled control and registers: 13,130</title></rect><text x="350.27951423452123" y="279" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >13,130 (5.5%)</text><text x="30" y="323" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Ribbon and chrome</text><rect x="290" y="304" width="9.9" height="28" rx="4" fill="#2563c9"><title>Ribbon and chrome: 2,496</title></rect><text x="307.9382838940872" y="323" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,496 (1.0%)</text></svg>