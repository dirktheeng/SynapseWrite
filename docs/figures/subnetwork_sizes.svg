d registers</text><rect x="290" y="260" width="48.0" height="28" rx="4" fill="#2563c9"><title>Compiled control and registers: 12,060</title></rect><text x="346.0191120844117" y="279" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >12,060 (5.1%)</text><text x="30" y="323" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Ribbon and chrome</text><rect x="290" y="304" width="9.9" height="28" rx="4" fill="#2563c9"><title>Ribbon and chrome: 2,496</title></rect><text x="307.9382838940872" y="323" font-size="13" fill="#1c2733" text-anchor="start" font-weight="400" >2,496 (1.1%)</text></svg>