<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" width="1000" height="456" role="img" aria-label="The network holds all application logic; glue and engine only run it" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>The network holds all application logic; glue and engine only run it</title><rect width="1000" height="456" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><defs><marker id="ac9d3dd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c9d3dd"/></marker></defs><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Where the logic lives</text><rect x="30" y="58" width="560" height="350" rx="12" fill="#e8f0fc" stroke="#2563c9" stroke-width="2"/><text x="50" y="88" font-size="16" fill="#1c2733" text-anchor="start" font-weight="700" >The network: everything the app decides</text><text x="50" y="118" font-size="16" fill="#2563c9" text-anchor="start" font-weight="700" >+</text><text x="70" y="118" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="400" >Key names to editing commands</text><text x="50" y="151" font-size="16" fill="#2563c9" text-anchor="start" font-weight="700" >+</text><text x="70" y="151" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="400" >Hit testing from the screen id plane</text><text x="50" y="184" font-size="16" fill="#2563c9" text-anchor="start" font-weight="700" >+</text><text x="70" y="184" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="400" >Layout, line breaking, pagination</text><text x="50" y="217" font-size="16" fill="#2563c9" text-anchor="start" font-weight="700" >+</text><text x="70" y="217" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="400" >Drawing every glyph, icon and widget</text><text x="50" y="250" font-size="16" fill="#2563c9" text-anchor="start" font-weight="700" >+</text><text x="70" y="250" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="400" >Undo log, find, spell check, tables</text><text x="50" y="283" font-size="16" fill="#2563c9" text-anchor="start" font-weight="700" >+</text><text x="70" y="283" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="400" >Zip, inflate, deflate, CRC, XML, PNG, PDF</text><text x="50" y="316" font-size="16" fill="#2563c9" text-anchor="start" font-weight="700" >+</text><text x="70" y="316" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="400" >Every memory address, read, write and mask</text><text x="50" y="349" font-size="16" fill="#2563c9" text-anchor="start" font-weight="700" >+</text><text x="70" y="349" font-size="14.5" fill="#1c2733" text-anchor="start" font-weight="400" >File names, messages, when to set a timer</text><text x="50" y="396" font-size="13" fill="#5b6b7b" text-anchor="start" font-weight="400" >243,217 neurons, written by a deterministic generator</text><rect x="610" y="58" width="360" height="172" rx="12" fill="#eef1f4" stroke="#5b6b7b" stroke-width="2"/><text x="630" y="88" font-size="16" fill="#1c2733" text-anchor="start" font-weight="700" >host/glue.js: 83 lines</text><text x="630" y="116" font-size="13.5" fill="#1c2733" text-anchor="start" font-weight="400" >Start inference, repeat ticks to halt</text><text x="630" y="142" font-size="13.5" fill="#1c2733" text-anchor="start" font-weight="400" >Encode events and bytes as vectors</text><text x="630" y="168" font-size="13.5" fill="#1c2733" text-anchor="start" font-weight="400" >Show the output tensor with putImageData</text><text x="630" y="194" font-size="13.5" fill="#1c2733" text-anchor="start" font-weight="400" >Execute named commands from output neurons</text><rect x="610" y="240" width="360" height="168" rx="12" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="2"/><text x="630" y="270" font-size="16" fill="#1c2733" text-anchor="start" font-weight="700" >host/engine.c: 140 lines</text><text x="630" y="298" font-size="13.5" fill="#1c2733" text-anchor="start" font-weight="400" >Sparse layered neuron evaluation</text><text x="630" y="324" font-size="13.5" fill="#1c2733" text-anchor="start" font-weight="400" >Passive ports: bank, image, patch, copy</text><text x="630" y="350" font-size="13.5" fill="#1c2733" text-anchor="start" font-weight="400" >Zero-rest live lists and lazy pulls</text><text x="630" y="376" font-size="13.5" fill="#1c2733" text-anchor="start" font-weight="400" >No character codes, no document logic</text><text x="500" y="436" font-size="13" fill="#5b6b7b" text-anchor="middle" font-weight="400" >test/audit.py holds exact allow lists for every condition and string in the glue, and fails on anything new.</text></svg>