<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" width="1000" height="214" role="img" aria-label="Build pipeline from generator to static page" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Build pipeline from generator to static page</title><rect width="1000" height="214" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><defs><marker id="ac9d3dd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c9d3dd"/></marker></defs><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >From Python to weights to a single web page</text><rect x="30" y="70" width="160" height="92" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="110.0" y="113.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >gen/*.py</text><text x="110.0" y="131.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >Deterministic</text><text x="110.0" y="147.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >weight generator</text><path d="M190 116H223" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><circle r="6" fill="#2563c9" opacity="0"><animateMotion path="M190 116H223" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1429;1"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.0000;0.0010;0.1429;0.1439;1" values="0;0;1;1;0;0"/></circle><rect x="225" y="70" width="160" height="92" rx="9" fill="#efebfa" stroke="#7a5cd6" stroke-width="1.5"/><text x="305.0" y="113.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Open fonts</text><text x="305.0" y="131.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >Outlines become</text><text x="305.0" y="147.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >edge neurons</text><path d="M385 116H418" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><circle r="6" fill="#7a5cd6" opacity="0"><animateMotion path="M385 116H418" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1857;0.3286;1"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.1857;0.1867;0.3286;0.3296;1" values="0;0;1;1;0;0"/></circle><rect x="420" y="70" width="160" height="92" rx="9" fill="#eef1f4" stroke="#5b6b7b" stroke-width="1.5"/><text x="500.0" y="113.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Optimizer passes</text><text x="500.0" y="131.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >Dead code, merge</text><text x="500.0" y="147.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >duplicates</text><path d="M580 116H613" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><circle r="6" fill="#5b6b7b" opacity="0"><animateMotion path="M580 116H613" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3714;0.5143;1"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.3714;0.3724;0.5143;0.5153;1" values="0;0;1;1;0;0"/></circle><rect x="615" y="70" width="160" height="92" rx="9" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="1.5"/><text x="695.0" y="113.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Compact stream</text><text x="695.0" y="131.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >Layer order,</text><text x="695.0" y="147.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >varints, gzip</text><path d="M775 116H808" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><circle r="6" fill="#0f9d8a" opacity="0"><animateMotion path="M775 116H808" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5571;0.7000;1"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.5571;0.5581;0.7000;0.7010;1" values="0;0;1;1;0;0"/></circle><rect x="810" y="70" width="160" height="92" rx="9" fill="#fdf1e0" stroke="#d97706" stroke-width="1.5"/><text x="890.0" y="113.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >index.html</text><text x="890.0" y="131.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >3.8 MB, static,</text><text x="890.0" y="147.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >one file</text><text x="500" y="196" font-size="14" fill="#5b6b7b" text-anchor="middle" font-weight="400" >No data set, loss, gradient, search or fitting exists anywhere in this path. Python only runs at build time.</text></svg>