<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="Animated forward substitution example" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><title>One sweep through a lower triangular matrix</title><rect width="1000" height="310" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >One sweep: filling in the vector from the top down</text><text x="30" y="62" font-size="14.5" fill="#5b6b7b" text-anchor="start" font-weight="400" >Each row only uses numbers above it, so the same vector can appear on both sides with nothing circular.</text><text x="148" y="96" font-size="18" fill="#2563c9" text-anchor="middle" font-weight="700" >v</text><text x="384" y="96" font-size="18" fill="#2563c9" text-anchor="middle" font-weight="700" >F</text><text x="598" y="96" font-size="18" fill="#2563c9" text-anchor="middle" font-weight="700" >v</text><text x="718" y="96" font-size="15" fill="#2563c9" text-anchor="middle" font-weight="700" >input</text><text x="106" y="137" font-size="17" fill="#5b6b7b" text-anchor="end" font-weight="400" >a</text><rect x="120" y="108" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="148" y="137" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="400" ></text><rect x="570" y="108" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="598" y="137" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="400" ></text><rect x="690" y="108" width="56" height="44" fill="#fdf1e0" stroke="#c9d3dd"/><text x="718" y="137" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="400" >5</text><rect x="300" y="108" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="328" y="137" font-size="18" fill="#a8b4c0" text-anchor="middle" font-weight="400" >0</text><rect x="356" y="108" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="384" y="137" font-size="18" fill="#a8b4c0" text-anchor="middle" font-weight="400" >0</text><rect x="412" y="108" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="440" y="137" font-size="18" fill="#a8b4c0" text-anchor="middle" font-weight="400" >0</text><rect x="296" y="106" width="176" height="48" rx="6" fill="none" stroke="#d97706" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.100;0.110;0.340;0.350;1" values="0;0;1;1;0;0" /></rect><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.190;0.200;.98;1" values="0;0;1;1;0"/><text x="148" y="137" font-size="19" fill="#2563c9" text-anchor="middle" font-weight="700" >5</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.190;0.200;.98;1" values="0;0;1;1;0"/><text x="598" y="137" font-size="19" fill="#2563c9" text-anchor="middle" font-weight="700" >5</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.100;0.110;0.340;0.350;1" values="0;0;1;1;0;0" /><text x="500" y="284" font-size="19" fill="#1c2733" text-anchor="middle" font-weight="700" >Step 1:  a = 5</text></g><text x="106" y="181" font-size="17" fill="#5b6b7b" text-anchor="end" font-weight="400" >b</text><rect x="120" y="152" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="148" y="181" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="400" ></text><rect x="570" y="152" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="598" y="181" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="400" ></text><rect x="690" y="152" width="56" height="44" fill="#fdf1e0" stroke="#c9d3dd"/><text x="718" y="181" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="400" >0</text><rect x="300" y="152" width="56" height="44" fill="#e8f0fc" stroke="#c9d3dd"/><text x="328" y="181" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="700" >10</text><rect x="356" y="152" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="384" y="181" font-size="18" fill="#a8b4c0" text-anchor="middle" font-weight="400" >0</text><rect x="412" y="152" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="440" y="181" font-size="18" fill="#a8b4c0" text-anchor="middle" font-weight="400" >0</text><rect x="296" y="150" width="176" height="48" rx="6" fill="none" stroke="#d97706" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.360;0.370;0.600;0.610;1" values="0;0;1;1;0;0" /></rect><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.450;0.460;.98;1" values="0;0;1;1;0"/><text x="148" y="181" font-size="19" fill="#2563c9" text-anchor="middle" font-weight="700" >50</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.450;0.460;.98;1" values="0;0;1;1;0"/><text x="598" y="181" font-size="19" fill="#2563c9" text-anchor="middle" font-weight="700" >50</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.360;0.370;0.600;0.610;1" values="0;0;1;1;0;0" /><text x="500" y="284" font-size="19" fill="#1c2733" text-anchor="middle" font-weight="700" >Step 2:  b = 10 × a = 50</text></g><text x="106" y="225" font-size="17" fill="#5b6b7b" text-anchor="end" font-weight="400" >c</text><rect x="120" y="196" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="148" y="225" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="400" ></text><rect x="570" y="196" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="598" y="225" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="400" ></text><rect x="690" y="196" width="56" height="44" fill="#fdf1e0" stroke="#c9d3dd"/><text x="718" y="225" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="400" >0</text><rect x="300" y="196" width="56" height="44" fill="#e8f0fc" stroke="#c9d3dd"/><text x="328" y="225" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="700" >1</text><rect x="356" y="196" width="56" height="44" fill="#e8f0fc" stroke="#c9d3dd"/><text x="384" y="225" font-size="18" fill="#1c2733" text-anchor="middle" font-weight="700" >1</text><rect x="412" y="196" width="56" height="44" fill="#fff" stroke="#c9d3dd"/><text x="440" y="225" font-size="18" fill="#a8b4c0" text-anchor="middle" font-weight="400" >0</text><rect x="296" y="194" width="176" height="48" rx="6" fill="none" stroke="#d97706" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.620;0.630;0.860;0.870;1" values="0;0;1;1;0;0" /></rect><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.710;0.720;.98;1" values="0;0;1;1;0"/><text x="148" y="225" font-size="19" fill="#2563c9" text-anchor="middle" font-weight="700" >55</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.710;0.720;.98;1" values="0;0;1;1;0"/><text x="598" y="225" font-size="19" fill="#2563c9" text-anchor="middle" font-weight="700" >55</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.620;0.630;0.860;0.870;1" values="0;0;1;1;0;0" /><text x="500" y="284" font-size="19" fill="#1c2733" text-anchor="middle" font-weight="700" >Step 3:  c = a + b = 55</text></g><text x="210" y="182" font-size="28" fill="#1c2733" text-anchor="middle" font-weight="400" >=</text><text x="496" y="182" font-size="24" fill="#1c2733" text-anchor="middle" font-weight="400" >×</text><text x="658" y="182" font-size="26" fill="#1c2733" text-anchor="middle" font-weight="400" >+</text><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.880;0.890;.98;1" values="0;0;1;1;0"/><text x="500" y="284" font-size="18" fill="#0f9d8a" text-anchor="middle" font-weight="700" >Done. Multiply it out and you get the same vector back.</text></g></svg>