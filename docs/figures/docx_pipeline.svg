<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 342" width="1000" height="342" role="img" aria-label="Open and save pipelines through zip, inflate, XML, deflate and CRC networks" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Open and save pipelines through zip, inflate, XML, deflate and CRC networks</title><rect width="1000" height="342" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><defs><marker id="ac9d3dd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c9d3dd"/></marker><marker id="a0f9d8a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0f9d8a"/></marker></defs><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >File formats are networks too</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Glue only moves bytes into the bank and out again. No library parses or writes these files.</text><text x="30" y="90" font-size="14" fill="#2563c9" text-anchor="start" font-weight="700" >Open</text><rect x="30" y="100" width="140" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="100.0" y="132.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >File bytes</text><text x="100.0" y="150.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >from the glue</text><path d="M170 135H191" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="193" y="100" width="140" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="263.0" y="132.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >Zip directory</text><text x="263.0" y="150.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >find members</text><path d="M333 135H354" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="356" y="100" width="140" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="426.0" y="132.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >Inflate</text><text x="426.0" y="150.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >Huffman, LZ77</text><path d="M496 135H517" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="519" y="100" width="140" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="589.0" y="132.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >XML automaton</text><text x="589.0" y="150.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >tags, runs, tables</text><path d="M659 135H680" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="682" y="100" width="140" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="752.0" y="132.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >Interned styles</text><text x="752.0" y="150.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >find or add</text><path d="M822 135H843" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="845" y="100" width="140" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="915.0" y="132.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >Paragraph slots</text><text x="915.0" y="150.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >the document</text><text x="30" y="210" font-size="14" fill="#0f9d8a" text-anchor="start" font-weight="700" >Save</text><rect x="30" y="220" width="140" height="70" rx="9" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="1.5"/><text x="100.0" y="252.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >Paragraph slots</text><text x="100.0" y="270.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >the document</text><path d="M170 255H191" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="193" y="220" width="140" height="70" rx="9" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="1.5"/><text x="263.0" y="252.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >XML writer</text><text x="263.0" y="270.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >document parts</text><path d="M333 255H354" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="356" y="220" width="140" height="70" rx="9" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="1.5"/><text x="426.0" y="252.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >Deflate</text><text x="426.0" y="270.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >hash matches</text><path d="M496 255H517" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="519" y="220" width="140" height="70" rx="9" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="1.5"/><text x="589.0" y="252.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >CRC32</text><text x="589.0" y="270.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >over each part</text><path d="M659 255H680" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="682" y="220" width="140" height="70" rx="9" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="1.5"/><text x="752.0" y="252.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >Zip container</text><text x="752.0" y="270.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >table driven</text><path d="M822 255H843" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="845" y="220" width="140" height="70" rx="9" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="1.5"/><text x="915.0" y="252.0" font-size="13.5" fill="#1c2733" text-anchor="middle" font-weight="600" >Download</text><text x="915.0" y="270.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >on command</text><circle r="7" fill="#2563c9" opacity="0"><animateMotion path="M30 92H985" dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.4500;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.0000;0.0010;0.4500;0.4510;1" values="0;0;1;1;0;0"/></circle><circle r="7" fill="#0f9d8a" opacity="0"><animateMotion path="M30 212H985" dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.9500;1"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5000;0.5010;0.9500;0.9510;1" values="0;0;1;1;0;0"/></circle><text x="500" y="322" font-size="13.5" fill="#5b6b7b" text-anchor="middle" font-weight="400" >Pictures (PNG) and PDF export follow the same pattern, including embedded font subsets in the PDF.</text></svg>