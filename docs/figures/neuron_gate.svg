<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 326" width="1000" height="326" role="img" aria-label="Identity, step and ReLU neurons, and a big-M gate passing or blocking a value" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Identity, step and ReLU neurons, and a big-M gate passing or blocking a value</title><rect width="1000" height="326" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><defs><marker id="ac9d3dd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c9d3dd"/></marker><marker id="a2563c9" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2563c9"/></marker></defs><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Three neurons, and the gate that makes them a computer</text><rect x="30" y="60" width="190" height="178" rx="9" fill="#ffffff" stroke="#c9d3dd"/><path d="M48 165H202M125 96V208" stroke="#c9d3dd"/><path d="M65 205L185 105" fill="none" stroke="#2563c9" stroke-width="3" stroke-linecap="round"/><text x="44" y="86" font-size="15" fill="#1c2733" text-anchor="start" font-weight="700" >Identity</text><text x="125" y="228" font-size="13" fill="#5b6b7b" text-anchor="middle" font-weight="400" >y = x</text><rect x="235" y="60" width="190" height="178" rx="9" fill="#ffffff" stroke="#c9d3dd"/><path d="M253 165H407M330 96V208" stroke="#c9d3dd"/><path d="M260 165H330V115H400" fill="none" stroke="#2563c9" stroke-width="3" stroke-linecap="round"/><text x="249" y="86" font-size="15" fill="#1c2733" text-anchor="start" font-weight="700" >Step</text><text x="330" y="228" font-size="13" fill="#5b6b7b" text-anchor="middle" font-weight="400" >y = 1 if x &gt; 0</text><rect x="440" y="60" width="190" height="178" rx="9" fill="#ffffff" stroke="#c9d3dd"/><path d="M458 165H612M535 96V208" stroke="#c9d3dd"/><path d="M465 165H535L595 105" fill="none" stroke="#2563c9" stroke-width="3" stroke-linecap="round"/><text x="454" y="86" font-size="15" fill="#1c2733" text-anchor="start" font-weight="700" >ReLU</text><text x="535" y="228" font-size="13" fill="#5b6b7b" text-anchor="middle" font-weight="400" >y = max(0, x)</text><rect x="650" y="60" width="320" height="178" rx="9" fill="#ffffff" stroke="#c9d3dd"/><text x="666" y="86" font-size="15" fill="#1c2733" text-anchor="start" font-weight="700" >Big-M gate</text><text x="666" y="110" font-size="13" fill="#5b6b7b" text-anchor="start" font-weight="400" >y = relu(v + en * M - M),  M = 2^40</text><text x="700" y="150" font-size="14" fill="#5b6b7b" text-anchor="middle" font-weight="400" >v</text><text x="700" y="178" font-size="20" fill="#1c2733" text-anchor="middle" font-weight="700" >42</text><text x="810" y="150" font-size="14" fill="#5b6b7b" text-anchor="middle" font-weight="400" >en</text><text x="810" y="178" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle">1<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.48;.5;.98;1"/></text><text x="810" y="178" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle" opacity="0">0<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.48;.5;.98;1"/></text><text x="920" y="150" font-size="14" fill="#5b6b7b" text-anchor="middle" font-weight="400" >y</text><text x="920" y="178" font-size="20" font-weight="700" fill="#2563c9" text-anchor="middle">42<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.48;.5;.98;1"/></text><text x="920" y="178" font-size="20" font-weight="700" fill="#2563c9" text-anchor="middle" opacity="0">0<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.48;.5;.98;1"/></text><text x="810" y="216" font-size="12.5" fill="#5b6b7b" text-anchor="middle" font-weight="400" >Open: v passes. Closed: output is exactly 0.</text><rect x="30" y="256" width="940" height="52" rx="9" fill="#e8f0fc" stroke="#2563c9"/><text x="500" y="288" font-size="14.5" fill="#1c2733" text-anchor="middle" font-weight="600" >Neurons rest at zero, and a closed gate skips its value inputs, so idle parts of the network cost nothing.</text></svg>