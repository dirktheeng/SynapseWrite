<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="A token moves through one-hot state neurons: idle, key handling, edit, layout, paint" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>A token moves through one-hot state neurons: idle, key handling, edit, layout, paint</title><rect width="1000" height="380" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><defs><marker id="ac9d3dd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c9d3dd"/></marker><marker id="ad97706" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d97706"/></marker></defs><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >Control flow is a token moving through one-hot state neurons</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Exactly one state neuron is 1. Its weights open the gates that load registers and drive ports.</text><rect x="15" y="90" width="150" height="70" rx="9" fill="#eef1f4" stroke="#5b6b7b" stroke-width="1.5"/><text x="90.0" y="122.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Idle</text><text x="90.0" y="140.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >waiting</text><path d="M165 125H193" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="15" y="90" width="150" height="70" rx="9" fill="#d97706" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.0000;0.0867;0.1733;1" values="0;0;.28;0;0"/></rect><rect x="195" y="90" width="150" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="270.0" y="122.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Key handling</text><text x="270.0" y="140.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >name the key</text><path d="M345 125H373" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="195" y="90" width="150" height="70" rx="9" fill="#d97706" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.1733;0.2600;0.3467;1" values="0;0;.28;0;0"/></rect><rect x="375" y="90" width="150" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="450.0" y="122.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Edit</text><text x="450.0" y="140.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >write text cell</text><path d="M525 125H553" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="375" y="90" width="150" height="70" rx="9" fill="#d97706" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.3467;0.4333;0.5200;1" values="0;0;.28;0;0"/></rect><rect x="555" y="90" width="150" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="630.0" y="122.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Layout</text><text x="630.0" y="140.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >break lines</text><path d="M705 125H733" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="555" y="90" width="150" height="70" rx="9" fill="#d97706" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.5200;0.6067;0.6933;1" values="0;0;.28;0;0"/></rect><rect x="735" y="90" width="150" height="70" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="810.0" y="122.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Paint</text><text x="810.0" y="140.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >draw glyphs</text><rect x="735" y="90" width="150" height="70" rx="9" fill="#d97706" opacity="0"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.6933;0.7800;0.8667;1" values="0;0;.28;0;0"/></rect><path d="M810 160V192H90V162" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#ad97706)" stroke-dasharray='5 4'/><text x="450" y="187" font-size="13" fill="#d97706" text-anchor="middle" font-weight="600" >halt raised, wait for the next event</text><circle r="7" fill="#d97706" opacity="0"><animateMotion path="M90 76H810" dur="7.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.6933;1"/><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.0000;0.0010;0.6933;0.6943;1" values="0;0;1;1;0;0"/></circle><rect x="30" y="232" width="940" height="128" rx="9" fill="#ffffff" stroke="#c9d3dd"/><text x="50" y="260" font-size="14" fill="#1c2733" text-anchor="start" font-weight="700" >Written in the generator, not trained:</text><text x="50" y="288" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1c2733" xml:space="preserve">on(&#x27;KEY_TYPED&#x27;,</text><text x="50" y="310" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1c2733" xml:space="preserve">   (is_enter,  &#x27;SPLIT_PARA&#x27;, {}),</text><text x="50" y="332" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#1c2733" xml:space="preserve">   (None,      &#x27;INS_CHAR&#x27;,   {cursor: cursor + 1, dirty: ONE}))</text><text x="610" y="288" font-size="13.5" fill="#5b6b7b" text-anchor="start" font-weight="400" >Each rule becomes an AND neuron.</text><text x="610" y="310" font-size="13.5" fill="#5b6b7b" text-anchor="start" font-weight="400" >Each assignment becomes a gated weight.</text><text x="610" y="332" font-size="13.5" fill="#5b6b7b" text-anchor="start" font-weight="400" >State names here are illustrative of the rule form.</text></svg>