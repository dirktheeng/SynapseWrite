<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" role="img" aria-label="Memory bank map" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Memory bank map</title><rect width="800" height="456" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >One passive memory bank</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Cells are 32-bit floats. Pages exist only once written, so far apart regions cost nothing until used. Not to scale.</text><rect x="30" y="78" width="150" height="32" rx="6" fill="#e8f0fc" stroke="#2563c9"/><text x="105" y="99" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600" >0 to 100 K</text><text x="196" y="99" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Fixed tables: hit targets, styles, numbering, sections</text><rect x="30" y="116" width="150" height="32" rx="6" fill="#e8f0fc" stroke="#2563c9"/><text x="105" y="137" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600" >100 K to 1.02 M</text><text x="196" y="137" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Mail merge, footnotes, zip records, headers and footers</text><rect x="30" y="154" width="150" height="32" rx="6" fill="#efebfa" stroke="#7a5cd6"/><text x="105" y="175" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600" >1.1 M to 1.4 M</text><text x="196" y="175" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Interned styles, bookmarks, spell suggestions, equations</text><rect x="30" y="192" width="150" height="32" rx="6" fill="#fdf1e0" stroke="#d97706"/><text x="105" y="213" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600" >1.4 M to 2 M</text><text x="196" y="213" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Clipboards</text><rect x="30" y="230" width="150" height="32" rx="6" fill="#e2f5f2" stroke="#0f9d8a"/><text x="105" y="251" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600" >2 M to 14.4 M</text><text x="196" y="251" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Paragraph slots: 4,096 cells each</text><rect x="30" y="268" width="150" height="32" rx="6" fill="#fdf1e0" stroke="#d97706"/><text x="105" y="289" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600" >14.5 M to 20 M</text><text x="196" y="289" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Undo log</text><rect x="30" y="306" width="150" height="32" rx="6" fill="#eef1f4" stroke="#5b6b7b"/><text x="105" y="327" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600" >20 M to 61 M</text><text x="196" y="327" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Output bytes, pictures, save and load work space</text><rect x="30" y="344" width="150" height="32" rx="6" fill="#efebfa" stroke="#7a5cd6"/><text x="105" y="365" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600" >61 M to 63 M</text><text x="196" y="365" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Glyph cache: tags, then drawn glyphs</text><rect x="30" y="382" width="150" height="32" rx="6" fill="#e8f0fc" stroke="#2563c9"/><text x="105" y="403" font-size="13" fill="#1c2733" text-anchor="middle" font-weight="600" >63 M to 67 M</text><text x="196" y="403" font-size="14" fill="#1c2733" text-anchor="start" font-weight="400" >Read only tables: PDF fonts, literals, spell table, display lists</text><text x="30" y="442" font-size="13" fill="#5b6b7b" text-anchor="start" font-weight="400" >The build fails if any two declared regions overlap: region() in gen/nn.py.</text></svg>