uteName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.3875;0.3885;0.4875;0.4885;1" values="0;0;1;1;0;0"/></circle><rect x="30" y="462" width="940" height="44" rx="9" fill="#eef1f4" stroke="#c9d3dd"/><text x="500" y="489" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >Passive memory bank and glue: they execute what the network asked, and decide nothing</text><path d="M970 185H985V462" fill="none" stroke="#0f9d8a" stroke-width="1.6" marker-end="url(#a0f9d8a)" /><path d="M30 484H14V213H28" fill="none" stroke="#0f9d8a" stroke-width="1.6" marker-end="url(#a0f9d8a)" /><circle r="5" fill="#0f9d8a" opacity="0"><animateMotion path="M970 185H985V462" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4500;0.5625;1"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.4500;0.4510;0.5625;0.5635;1" values="0;0;1;1;0;0"/></circle><circle r="5" fill="#0f9d8a" opacity="0"><animateMotion path="M30 484H14V213H28" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6875;0.8500;1"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.6875;0.6885;0.8500;0.8510;1" values="0;0;1;1;0;0"/></circle><text x="500" y="532" font-size="13" fill="#5b6b7b" text-anchor="middle" font-weight="400" >Reads arrive on the next tick and last one tick, so the network plans its memory traffic like a pipeline.</text></svg>