<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 552" width="1000" height="552" role="img" aria-label="One tick: event, memory reads, state and last screenshot flow through the network to the next screenshot, memory operations, state, timer and halt" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>One tick: event, memory reads, state and last screenshot flow through the network to the next screenshot, memory operations, state, timer and halt</title><rect width="1000" height="552" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><defs><marker id="ac9d3dd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c9d3dd"/></marker><marker id="a0f9d8a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0f9d8a"/></marker><marker id="a7a5cd6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7a5cd6"/></marker><marker id="a5b6b7b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5b6b7b"/></marker></defs><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >One tick of the neural program</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Every event starts ticks. Ticks repeat until the network raises halt.</text><rect x="30" y="90" width="210" height="66" rx="9" fill="#fdf1e0" stroke="#d97706" stroke-width="1.5"/><text x="135.0" y="120.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Event vector</text><text x="135.0" y="138.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >key, mouse, timer, file</text><path d="M240 123H372" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="30" y="180" width="210" height="66" rx="9" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="1.5"/><text x="135.0" y="210.0" font-size="15" fill="#1c2733" text-anchor="middle" font-weight="600" >Memory read vectors</text><text x="135.0" y="228.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >asked for on the last tick</text><path d="M240 213H372" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="30" y="270" wi