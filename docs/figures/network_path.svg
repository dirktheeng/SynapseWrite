<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="Path of a key press through the sub-networks" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Path of a key press through the sub-networks</title><rect width="1000" height="410" rx="12" fill="#fbfcfd" stroke="#c9d3dd"/><defs><marker id="ac9d3dd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c9d3dd"/></marker></defs><text x="30" y="38" font-size="20" fill="#1c2733" text-anchor="start" font-weight="700" >The path of one key press through the sub-networks</text><text x="30" y="60" font-size="14" fill="#5b6b7b" text-anchor="start" font-weight="400" >Simplified to the main stops, from the paint path and a traced key press. Each state also runs through compiled control.</text><rect x="30" y="86" width="215" height="76" rx="9" fill="#fdf1e0" stroke="#d97706" stroke-width="1.5"/><text x="137.5" y="121.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >raw event interpretation</text><text x="137.5" y="139.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >names the key</text><path d="M245 124H264" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="266" y="86" width="215" height="76" rx="9" fill="#efebfa" stroke="#7a5cd6" stroke-width="1.5"/><text x="373.5" y="121.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >pointer</text><text x="373.5" y="139.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >restores pixels under it</text><path d="M481 124H500" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="502" y="86" width="215" height="76" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="609.5" y="121.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >key handling</text><text x="609.5" y="139.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >chooses the command</text><path d="M717 124H736" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="738" y="86" width="215" height="76" rx="9" fill="#e2f5f2" stroke="#0f9d8a" stroke-width="1.5"/><text x="845.5" y="121.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >edit primitives</text><text x="845.5" y="139.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >changes memory, logs undo</text><rect x="30" y="206" width="215" height="76" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="137.5" y="241.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >line breaking</text><text x="137.5" y="259.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >finds where lines end</text><path d="M245 244H264" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="266" y="206" width="215" height="76" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="373.5" y="241.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >layout and paint</text><text x="373.5" y="259.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >walks lines and words</text><path d="M481 244H500" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="502" y="206" width="215" height="76" rx="9" fill="#efebfa" stroke="#7a5cd6" stroke-width="1.5"/><text x="609.5" y="241.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >glyph network</text><text x="609.5" y="259.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >selects the character</text><path d="M717 244H736" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="738" y="206" width="215" height="76" rx="9" fill="#efebfa" stroke="#7a5cd6" stroke-width="1.5"/><text x="845.5" y="241.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >glyph unit</text><text x="845.5" y="259.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >cached rows, or draw it</text><path d="M845.5 162V184H137.5V204" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><rect x="30" y="326" width="215" height="64" rx="9" fill="#efebfa" stroke="#7a5cd6" stroke-width="1.5"/><text x="137.5" y="355.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >glyph patch</text><text x="137.5" y="373.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >glyph pixels are colored</text><rect x="266" y="326" width="215" height="64" rx="9" fill="#e8f0fc" stroke="#2563c9" stroke-width="1.5"/><text x="373.5" y="355.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >chrome</text><text x="373.5" y="373.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >caret, scrollbar, status</text><rect x="502" y="326" width="215" height="64" rx="9" fill="#efebfa" stroke="#7a5cd6" stroke-width="1.5"/><text x="609.5" y="355.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >pointer</text><text x="609.5" y="373.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >redrawn on top</text><rect x="738" y="326" width="232" height="64" rx="9" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/><text x="854.0" y="355.0" font-size="14" fill="#1c2733" text-anchor="middle" font-weight="600" >halt neuron</text><text x="854.0" y="373.0" font-size="12" fill="#5b6b7b" text-anchor="middle" font-weight="400" >the glue stops ticking</text><path d="M845.5 282V304H137.5V324" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><path d="M245 358H264" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><path d="M481 358H500" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><path d="M717 358H736" fill="none" stroke="#c9d3dd" stroke-width="1.6" marker-end="url(#ac9d3dd)" /><circle r="7" fill="#d97706" opacity="0"><animateMotion path="M137.5 124H845.5V184H137.5V244H845.5V304H137.5V358H850" dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.8750;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.0000;0.0010;0.8750;0.8760;1" values="0;0;1;1;0;0"/></circle></svg>